spring:
  application:
    name: ${APP_NAME:MusicApp}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3367/music}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jackson:
    mapper:
      sort-properties-alphabetically: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
server:
  port: ${PORT:8080}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true