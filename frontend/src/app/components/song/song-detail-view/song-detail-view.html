<div>
    @if(itemShow != null){
        <div>{{itemShow.id}}</div>
        <div>{{itemShow.name}}</div>
        @if(itemShow.artist != null){
            <div>{{itemShow.artist.name}}</div>
        }
        @if(itemShow.album != null){
            <div>{{itemShow.album.name}}</div>
        }
        <div>{{itemShow.url}}</div>
    }
    @else{
        <div>None</div>
    }
</div>
